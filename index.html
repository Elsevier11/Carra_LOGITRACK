<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack</title>
    <script>
      // Fallback UI: mostra un errore se il bundle JS non parte (cache, estensioni, SW, ecc.)
      window.__LOGITRACK_BOOTSTRAPPED__ = false;
      (function () {
        function show(message) {
          var el = document.getElementById('boot-fallback');
          if (!el) {
            // Se il DOM non è ancora pronto, riprova tra poco.
            setTimeout(function () {
              show(message);
            }, 50);
            return;
          }

          el.style.display = 'block';
          el.innerHTML =
            '<h1 style="font-size:16px; margin:0 0 12px;">LogiTrack - Avvio non riuscito</h1>' +
            '<pre style="white-space: pre-wrap; margin:0; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:12px;">' +
            String(message) +
            '</pre>' +
            '<div style="margin-top:12px; font-size:12px; color:#475569;">Apri DevTools → Console/Network per il dettaglio.</div>';
        }

        window.addEventListener('error', function (e) {
          show((e && (e.error && (e.error.stack || e.error.message))) || (e && e.message) || e);
        });
        window.addEventListener('unhandledrejection', function (e) {
          show((e && e.reason && (e.reason.stack || e.reason.message)) || (e && e.reason) || e);
        });

        setTimeout(function () {
          if (!window.__LOGITRACK_BOOTSTRAPPED__) {
            show('Il bundle JavaScript non si è avviato. Possibile cache/Service Worker/estensione che blocca gli script.');
          }
        }, 1500);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; padding: 16px; color: #0f172a;">
        <h1 style="font-size:16px; margin:0 0 12px;">LogiTrack</h1>
        <pre style="white-space: pre-wrap; margin:0; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:12px;">Caricamento...</pre>
        <div style="margin-top:12px; font-size:12px; color:#475569;">Se resta così, apri DevTools → Console/Network.</div>
      </div>
    </div>
    <noscript>
      <div style="padding:16px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;">
        JavaScript è disabilitato: LogiTrack richiede JavaScript per funzionare.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
